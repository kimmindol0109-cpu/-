<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>류현진의 삼진 아웃 ⚾</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap');

  :root {
    --orange: #E8521A;
    --orange-dark: #B83E0E;
    --orange-light: #FF7A45;
    --cream: #FFF8F0;
    --navy: #1A1A2E;
    --navy-light: #16213E;
    --gold: #FFD700;
    --grass: #2D7A2D;
    --grass-light: #3DA33D;
    --dirt: #C8A882;
    --white: #FFFFFF;
    --strike-red: #FF3333;
    --ball-green: #33CC66;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── SCREEN MANAGEMENT ── */
  .screen { display: none; width: 100vw; height: 100vh; }
  .screen.active { display: flex; }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1e2a4a 0%, var(--navy) 70%);
    position: relative;
    overflow: hidden;
  }

  #loginScreen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='2' fill='%23ffffff08'/%3E%3C/svg%3E");
    animation: bgScroll 20s linear infinite;
  }

  @keyframes bgScroll {
    from { background-position: 0 0; }
    to { background-position: 60px 60px; }
  }

  .login-card {
    background: linear-gradient(145deg, rgba(232,82,26,0.15), rgba(26,26,46,0.95));
    border: 2px solid rgba(232,82,26,0.4);
    border-radius: 24px;
    padding: 50px 60px;
    width: 460px;
    max-width: 95vw;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 60px rgba(232,82,26,0.1);
    position: relative;
    z-index: 1;
    animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .pitcher-emoji {
    font-size: 80px;
    display: block;
    margin-bottom: 8px;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .login-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--orange);
    text-shadow: 0 0 20px rgba(232,82,26,0.5);
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 14px;
    color: rgba(255,248,240,0.6);
    margin-bottom: 32px;
    letter-spacing: 1px;
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group input {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(232,82,26,0.3);
    border-radius: 12px;
    color: var(--cream);
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 16px;
    outline: none;
    transition: all 0.3s;
  }

  .input-group input::placeholder { color: rgba(255,248,240,0.3); }

  .input-group input:focus {
    border-color: var(--orange);
    background: rgba(232,82,26,0.1);
    box-shadow: 0 0 20px rgba(232,82,26,0.2);
  }

  .login-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 6px 20px rgba(232,82,26,0.4);
    letter-spacing: 1px;
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(232,82,26,0.6);
    background: linear-gradient(135deg, var(--orange-light), var(--orange));
  }

  .login-btn:active { transform: translateY(0); }

  /* ── GAME SCREEN ── */
  #gameScreen {
    flex-direction: row;
    align-items: stretch;
    background: var(--navy);
  }

  /* Left panel - Game */
  .game-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, rgba(45,122,45,0.3) 0%, transparent 70%);
  }

  /* Header */
  .game-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(90deg, var(--orange-dark), var(--orange), var(--orange-dark));
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 10;
  }

  .player-badge {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .player-avatar {
    width: 40px; height: 40px;
    background: var(--navy);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 2px solid var(--gold);
  }

  .player-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    color: white;
  }

  .game-title-bar {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    color: var(--cream);
    text-align: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .score-btn {
    padding: 8px 16px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 12px;
    transition: all 0.2s;
  }

  .score-btn:hover { background: rgba(0,0,0,0.5); }

  /* Count Display */
  .count-bar {
    display: flex;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(0,0,0,0.4);
    width: 100%;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid rgba(232,82,26,0.2);
  }

  .count-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-label {
    font-size: 12px;
    color: rgba(255,248,240,0.6);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .count-dots {
    display: flex;
    gap: 5px;
  }

  .count-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    transition: all 0.2s;
  }

  .count-dot.strike { background: var(--strike-red); border-color: var(--strike-red); box-shadow: 0 0 8px var(--strike-red); }
  .count-dot.ball { background: var(--ball-green); border-color: var(--ball-green); box-shadow: 0 0 8px var(--ball-green); }
  .count-dot.out { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px var(--gold); }

  .divider { width: 1px; height: 30px; background: rgba(255,255,255,0.15); margin: 0 8px; }

  .inning-display {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--gold);
    margin: 0 16px;
  }

  /* Baseball field */
  .field-container {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 10px;
  }

  #gameCanvas {
    border-radius: 12px;
    cursor: crosshair;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }

  /* Message overlay */
  .pitch-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: 'Black Han Sans', sans-serif;
    font-size: 52px;
    padding: 16px 40px;
    border-radius: 16px;
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
    transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .pitch-message.show { transform: translate(-50%, -50%) scale(1); }

  .pitch-message.strike-msg {
    background: linear-gradient(135deg, rgba(255,50,50,0.9), rgba(180,20,20,0.9));
    color: white;
    border: 3px solid #FF6666;
    box-shadow: 0 0 40px rgba(255,50,50,0.6);
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .pitch-message.ball-msg {
    background: linear-gradient(135deg, rgba(50,200,100,0.9), rgba(20,140,60,0.9));
    color: white;
    border: 3px solid #66FF99;
    box-shadow: 0 0 40px rgba(50,200,100,0.6);
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .pitch-message.out-msg {
    background: linear-gradient(135deg, rgba(255,215,0,0.9), rgba(200,160,0,0.9));
    color: var(--navy);
    border: 3px solid var(--gold);
    box-shadow: 0 0 40px rgba(255,215,0,0.6);
  }

  .pitch-message.walk-msg {
    background: linear-gradient(135deg, rgba(100,150,255,0.9), rgba(60,100,220,0.9));
    color: white;
    border: 3px solid #8899FF;
    box-shadow: 0 0 40px rgba(100,150,255,0.6);
  }

  /* Action button */
  .pitch-btn {
    margin: 12px auto;
    padding: 14px 50px;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    border: none;
    border-radius: 50px;
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(232,82,26,0.5);
    transition: all 0.2s;
    letter-spacing: 2px;
  }

  .pitch-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(232,82,26,0.7);
  }

  .pitch-btn:active { transform: translateY(1px); }
  .pitch-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Instructions */
  .instructions {
    padding: 8px 24px;
    font-size: 13px;
    color: rgba(255,248,240,0.5);
    text-align: center;
  }

  /* Right panel - Scoreboard */
  .score-panel {
    width: 280px;
    background: linear-gradient(180deg, rgba(26,26,46,0.98) 0%, rgba(20,20,40,0.98) 100%);
    border-left: 1px solid rgba(232,82,26,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .score-panel-header {
    padding: 20px;
    background: linear-gradient(135deg, var(--orange-dark), var(--orange));
    text-align: center;
  }

  .score-panel-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    color: white;
    letter-spacing: 2px;
  }

  .score-panel-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .leaderboard {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .leaderboard::-webkit-scrollbar { width: 4px; }
  .leaderboard::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
  .leaderboard::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 2px; }

  .rank-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.3s;
    animation: fadeInRank 0.4s ease;
  }

  @keyframes fadeInRank {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .rank-item:hover { background: rgba(232,82,26,0.1); border-color: rgba(232,82,26,0.2); }
  .rank-item.me { background: rgba(232,82,26,0.15); border-color: rgba(232,82,26,0.4); }

  .rank-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    flex-shrink: 0;
  }

  .rank-num.gold { background: var(--gold); color: var(--navy); }
  .rank-num.silver { background: #C0C0C0; color: var(--navy); }
  .rank-num.bronze { background: #CD7F32; color: white; }
  .rank-num.other { background: rgba(255,255,255,0.1); color: var(--cream); }

  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-detail { font-size: 10px; color: rgba(255,248,240,0.5); margin-top: 2px; }

  .rank-score {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    color: var(--orange);
  }

  .no-scores {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,248,240,0.3);
    font-size: 13px;
    line-height: 2;
  }

  /* ── RESULT SCREEN ── */
  #resultScreen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(232,82,26,0.2) 0%, var(--navy) 60%);
    position: relative;
    overflow: hidden;
  }

  .result-card {
    background: linear-gradient(145deg, rgba(26,26,46,0.95), rgba(30,30,60,0.95));
    border: 2px solid var(--orange);
    border-radius: 28px;
    padding: 50px 60px;
    width: 520px;
    max-width: 95vw;
    text-align: center;
    box-shadow: 0 0 80px rgba(232,82,26,0.3);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-emoji { font-size: 80px; margin-bottom: 16px; display: block; }

  .result-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--orange);
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(232,82,26,0.5);
  }

  .result-name {
    font-size: 16px;
    color: rgba(255,248,240,0.7);
    margin-bottom: 30px;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 30px;
  }

  .stat-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(232,82,26,0.2);
    border-radius: 12px;
    padding: 16px 8px;
  }

  .stat-value {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--orange);
  }

  .stat-label {
    font-size: 11px;
    color: rgba(255,248,240,0.5);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .result-rank-info {
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 28px;
    font-size: 15px;
    color: var(--gold);
  }

  .result-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .result-btn {
    padding: 14px 30px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .result-btn.primary {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: white;
    box-shadow: 0 6px 20px rgba(232,82,26,0.4);
  }

  .result-btn.secondary {
    background: rgba(255,255,255,0.08);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .result-btn:hover { transform: translateY(-2px); }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 14px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 100;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Floating balls animation */
  .float-ball {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(232,82,26,0.15);
    animation: floatUp linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-20px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<!-- ══════════════════ LOGIN SCREEN ══════════════════ -->
<div id="loginScreen" class="screen active">
  <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
    <div class="float-ball" style="left:10%;animation-duration:8s;animation-delay:0s;width:12px;height:12px"></div>
    <div class="float-ball" style="left:25%;animation-duration:11s;animation-delay:2s;width:6px;height:6px"></div>
    <div class="float-ball" style="left:50%;animation-duration:9s;animation-delay:4s;width:10px;height:10px"></div>
    <div class="float-ball" style="left:75%;animation-duration:12s;animation-delay:1s;width:8px;height:8px"></div>
    <div class="float-ball" style="left:90%;animation-duration:10s;animation-delay:3s;width:14px;height:14px"></div>
  </div>

  <div class="login-card">
    <span class="pitcher-emoji">⚾</span>
    <div class="login-title">류현진의<br>삼진 아웃!</div>
    <div class="login-sub">HYUN-JIN RYU · STRIKEOUT CHALLENGE</div>

    <div class="input-group">
      <input type="text" id="usernameInput" placeholder="닉네임을 입력하세요" maxlength="12" autocomplete="off"/>
    </div>

    <button class="login-btn" onclick="startGame()">⚾ 마운드에 오르기</button>
  </div>
</div>

<!-- ══════════════════ GAME SCREEN ══════════════════ -->
<div id="gameScreen" class="screen">

  <div class="game-panel">
    <!-- Header -->
    <div class="game-header">
      <div class="player-badge">
        <div class="player-avatar">🧢</div>
        <div>
          <div class="player-name" id="headerPlayerName">플레이어</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.7)">류현진 모드</div>
        </div>
      </div>
      <div class="game-title-bar">⚾ 삼진 아웃 ⚾</div>
      <button class="score-btn" onclick="showLeaderboard()">🏆 순위표</button>
    </div>

    <!-- Count Bar -->
    <div class="count-bar">
      <div class="count-group">
        <span class="count-label">스트라이크</span>
        <div class="count-dots">
          <div class="count-dot" id="s1"></div>
          <div class="count-dot" id="s2"></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="count-group">
        <span class="count-label">볼</span>
        <div class="count-dots">
          <div class="count-dot" id="b1"></div>
          <div class="count-dot" id="b2"></div>
          <div class="count-dot" id="b3"></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="inning-display">⬆️ 1회</div>
      <div class="divider"></div>
      <div class="count-group">
        <span class="count-label">아웃</span>
        <div class="count-dots">
          <div class="count-dot" id="o1"></div>
          <div class="count-dot" id="o2"></div>
          <div class="count-dot" id="o3"></div>
        </div>
      </div>
    </div>

    <!-- Canvas -->
    <div class="field-container">
      <canvas id="gameCanvas"></canvas>
      <div class="pitch-message" id="pitchMessage">스트라이크!</div>
    </div>

    <div class="instructions" id="gameInstructions">
      스트라이크 존에 클릭하면 스트라이크, 밖이면 볼! 타자를 삼진으로 잡아내세요!
    </div>
    <button class="pitch-btn" id="pitchBtn" onclick="readyNextPitch()">⚾ 투구 준비</button>
  </div>

  <!-- Scoreboard Panel -->
  <div class="score-panel" id="scorePanel">
    <div class="score-panel-header">
      <div class="score-panel-title">🏆 명예의 전당</div>
      <div class="score-panel-sub">실시간 순위</div>
    </div>
    <div class="leaderboard" id="leaderboard">
      <div class="no-scores">아직 기록이 없습니다.<br>첫 번째 투수가 되어보세요!</div>
    </div>
  </div>
</div>

<!-- ══════════════════ RESULT SCREEN ══════════════════ -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <span class="result-emoji" id="resultEmoji">🎉</span>
    <div class="result-title" id="resultTitle">1이닝 완투!</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase Config (replace with your own) ──────────────
const firebaseConfig = {
  apiKey: "AIzaSyDemo-replace-with-your-key",
  authDomain: "ryu-strikeout.firebaseapp.com",
  databaseURL: "https://ryu-strikeout-default-rtdb.firebaseio.com",
  projectId: "ryu-strikeout",
  storageBucket: "ryu-strikeout.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:demo"
};

let db = null;
try {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch(e) {
  console.warn("Firebase 미연결 - 로컬 모드로 실행:", e.message);
}

// ── Game State ─────────────────────────────────────────────
let playerName = "";
let strikes = 0, balls = 0, outs = 0;
let strikeouts = 0, walks = 0;
let pitchCount = 0;
let gameOver = false;
let canPitch = false;
let animationId = null;
let ball = null;
let localScores = [];

// Canvas setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const panel = document.querySelector('.field-container');
  const w = panel.clientWidth - 20;
  const h = panel.clientHeight - 20;
  canvas.width = Math.min(w, 640);
  canvas.height = Math.min(h, 420);
  if (gameStarted) drawField();
}

let gameStarted = false;

// ── STRIKE ZONE DEFINITION ────────────────────────────────
function getStrikeZone() {
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.52;
  const w = canvas.width * 0.22;
  const h = canvas.height * 0.32;
  return { x: cx - w/2, y: cy - h/2, w, h };
}

// ── DRAW FIELD ────────────────────────────────────────────
function drawField() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  sky.addColorStop(0, '#0d1b2e');
  sky.addColorStop(1, '#1a2a4a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Grass
  const grass = ctx.createLinearGradient(0, H * 0.45, 0, H);
  grass.addColorStop(0, '#1e5e1e');
  grass.addColorStop(1, '#144414');
  ctx.fillStyle = grass;
  ctx.fillRect(0, H * 0.45, W, H * 0.55);

  // Grass stripes
  ctx.save();
  ctx.globalAlpha = 0.08;
  for (let i = 0; i < 8; i++) {
    if (i % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(i * W/8, H * 0.45, W/8, H * 0.55);
    }
  }
  ctx.restore();

  // Dirt infield ellipse
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(W/2, H * 0.75, W * 0.35, H * 0.22, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#8B6343';
  ctx.fill();
  ctx.strokeStyle = '#6B4423';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // Pitcher's mound
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(W/2, H * 0.62, 28, 14, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#A07850';
  ctx.fill();
  ctx.strokeStyle = '#806038';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // Pitcher rubber
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(W/2 - 12, H * 0.63, 24, 5);

  // Home plate (pentagon)
  const hx = W/2, hy = H * 0.88;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(hx, hy - 14);
  ctx.lineTo(hx + 14, hy - 7);
  ctx.lineTo(hx + 14, hy + 4);
  ctx.lineTo(hx - 14, hy + 4);
  ctx.lineTo(hx - 14, hy - 7);
  ctx.closePath();
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  // Bases
  const bSize = 14;
  [[W/2, H*0.48], [W/2+W*0.18, H*0.60], [W/2-W*0.18, H*0.60]].forEach(([bx, by]) => {
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle = '#EEEECC';
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.fillRect(-bSize/2, -bSize/2, bSize, bSize);
    ctx.strokeRect(-bSize/2, -bSize/2, bSize, bSize);
    ctx.restore();
  });

  // Foul lines
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(20, H * 0.45);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(W - 20, H * 0.45);
  ctx.stroke();
  ctx.restore();

  // Draw pitcher (Ryu)
  drawPitcher(W/2, H * 0.60);

  // Draw batter
  drawBatter(W/2, hy - 20);

  // Strike zone
  const sz = getStrikeZone();
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(sz.x, sz.y, sz.w, sz.h);
  ctx.setLineDash([]);

  // Zone fill on hover
  if (canPitch) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(sz.x, sz.y, sz.w, sz.h);
    // zone label
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px Nanum Gothic';
    ctx.textAlign = 'center';
    ctx.fillText('스트라이크 존', sz.x + sz.w/2, sz.y - 6);
  }
  ctx.restore();

  // Draw flying ball
  if (ball && ball.active) drawBall(ball.x, ball.y, ball.spin);
}

// Pitcher (Ryu) drawing - Orange uniform #99
function drawPitcher(cx, cy) {
  ctx.save();
  // Shadow
  ctx.beginPath();
  ctx.ellipse(cx, cy + 2, 14, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Legs
  ctx.fillStyle = '#CC4400';
  ctx.beginPath();
  ctx.roundRect(cx - 7, cy - 14, 6, 16, 2);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(cx + 1, cy - 14, 6, 16, 2);
  ctx.fill();

  // Shoes
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(cx - 4, cy + 3, 6, 3, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 4, cy + 3, 6, 3, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Jersey body (Orange)
  ctx.fillStyle = '#E8521A';
  ctx.beginPath();
  ctx.roundRect(cx - 12, cy - 32, 24, 20, 3);
  ctx.fill();

  // Jersey number 99
  ctx.fillStyle = 'white';
  ctx.font = 'bold 9px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('99', cx, cy - 18);

  // Belt
  ctx.fillStyle = '#111';
  ctx.fillRect(cx - 12, cy - 16, 24, 3);

  // Pitching arm (raised)
  ctx.fillStyle = '#E8521A';
  ctx.save();
  ctx.translate(cx + 12, cy - 28);
  ctx.rotate(-Math.PI * 0.4);
  ctx.beginPath();
  ctx.roundRect(-3, -14, 6, 16, 3);
  ctx.fill();
  ctx.restore();

  // Glove arm
  ctx.fillStyle = '#8B4513';
  ctx.save();
  ctx.translate(cx - 12, cy - 26);
  ctx.rotate(Math.PI * 0.15);
  ctx.beginPath();
  ctx.roundRect(-3, -4, 6, 12, 3);
  ctx.fill();
  ctx.restore();

  // Glove
  ctx.fillStyle = '#5D2E00';
  ctx.beginPath();
  ctx.arc(cx - 14, cy - 28, 7, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#FDBCB4';
  ctx.beginPath();
  ctx.arc(cx, cy - 38, 9, 0, Math.PI * 2);
  ctx.fill();

  // Cap (Orange)
  ctx.fillStyle = '#CC3D00';
  ctx.beginPath();
  ctx.arc(cx, cy - 43, 9, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 4, cy - 43, 5, 2, 0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Batter drawing
function drawBatter(cx, cy) {
  ctx.save();
  const bH = -35;

  // Shadow
  ctx.beginPath();
  ctx.ellipse(cx + 18, cy + 2, 12, 4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fill();

  // Legs
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(cx + 10, cy + bH + 20, 5, 14, 2);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(cx + 16, cy + bH + 20, 5, 14, 2);
  ctx.fill();

  // Shoes
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(cx + 12, cy + 2, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 19, cy + 2, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Jersey (white with blue stripes)
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath();
  ctx.roundRect(cx + 8, cy + bH + 4, 20, 18, 3);
  ctx.fill();
  ctx.fillStyle = '#1a3a8a';
  ctx.fillRect(cx + 12, cy + bH + 4, 2, 18);
  ctx.fillRect(cx + 20, cy + bH + 4, 2, 18);

  // Helmet
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(cx + 14, cy + bH - 2, 9, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(cx + 6, cy + bH - 2, 12, 5, 2);
  ctx.fill();

  // Face
  ctx.fillStyle = '#FDBCB4';
  ctx.beginPath();
  ctx.arc(cx + 14, cy + bH + 2, 6, 0, Math.PI * 2);
  ctx.fill();

  // Arms
  ctx.fillStyle = '#f0f0f0';
  ctx.save();
  ctx.translate(cx + 8, cy + bH + 8);
  ctx.rotate(0.3);
  ctx.beginPath();
  ctx.roundRect(-3, -3, 5, 12, 2);
  ctx.fill();
  ctx.restore();

  // Bat
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 5, cy + bH + 6);
  ctx.lineTo(cx - 16, cy + bH - 20);
  ctx.stroke();

  ctx.restore();
}

function drawBall(x, y, spin) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);

  // Ball
  const grad = ctx.createRadialGradient(-3, -3, 1, 0, 0, 9);
  grad.addColorStop(0, '#FFFFFF');
  grad.addColorStop(1, '#DDDDCC');
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Seams
  ctx.strokeStyle = '#CC3322';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0.5, 2.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 6, 3.7, 5.7);
  ctx.stroke();

  ctx.restore();
}

// ── PITCH MECHANICS ───────────────────────────────────────
let hoverX = 0, hoverY = 0;

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  hoverX = e.clientX - rect.left;
  hoverY = e.clientY - rect.top;
  if (canPitch) drawField();
});

canvas.addEventListener('click', (e) => {
  if (!canPitch || gameOver) return;

  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  throwBall(clickX, clickY);
});

function throwBall(targetX, targetY) {
  canPitch = false;
  document.getElementById('pitchBtn').disabled = true;
  document.getElementById('pitchBtn').textContent = '투구 중...';

  const sz = getStrikeZone();
  const isStrike = (
    targetX >= sz.x && targetX <= sz.x + sz.w &&
    targetY >= sz.y && targetY <= sz.y + sz.h
  );

  const startX = canvas.width / 2;
  const startY = canvas.height * 0.60;

  ball = { x: startX, y: startY, spin: 0, active: true };

  const duration = 400;
  const start = performance.now();

  function animate(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

    ball.x = startX + (targetX - startX) * ease;
    ball.y = startY + (targetY - startY) * ease;
    ball.spin += 0.3;

    drawField();

    if (t < 1) {
      animationId = requestAnimationFrame(animate);
    } else {
      ball.active = false;
      drawField();
      processPitch(isStrike, targetX, targetY);
    }
  }

  requestAnimationFrame(animate);
}

function processPitch(isStrike, tx, ty) {
  pitchCount++;
  const msg = document.getElementById('pitchMessage');

  if (isStrike) {
    strikes++;
    updateDots('s', strikes, 'strike');
    showMessage(strikes === 2 ? '⚡ 스트라이크!!' : strikes === 1 ? '🔥 스트라이크!' : '⚡ 스트라이크!!', 'strike-msg');

    if (strikes >= 3) {
      // Strikeout!
      setTimeout(() => {
        strikeouts++;
        outs++;
        strikes = 0; balls = 0;
        updateDots('s', 0, 'strike');
        updateDots('b', 0, 'ball');
        updateDots('o', outs, 'out');
        showMessage('🔥 삼진 아웃! K', 'out-msg');

        if (outs >= 3) {
          setTimeout(() => endInning(), 1200);
        } else {
          setTimeout(() => {
            hideMessage();
            enablePitch();
          }, 1200);
        }
      }, 700);
      return;
    }
  } else {
    balls++;
    updateDots('b', balls, 'ball');
    showMessage(balls === 4 ? '😅 볼넷...' : '😬 볼!', 'ball-msg');

    if (balls >= 4) {
      // Walk
      setTimeout(() => {
        walks++;
        outs++;
        strikes = 0; balls = 0;
        updateDots('s', 0, 'strike');
        updateDots('b', 0, 'ball');
        updateDots('o', outs, 'out');
        showMessage('😭 볼넷 진루...', 'walk-msg');

        if (outs >= 3) {
          setTimeout(() => endInning(), 1200);
        } else {
          setTimeout(() => {
            hideMessage();
            enablePitch();
          }, 1200);
        }
      }, 700);
      return;
    }
  }

  setTimeout(() => {
    hideMessage();
    if (!gameOver) enablePitch();
  }, 900);
}

function updateDots(type, count, cls) {
  const ids = type === 's' ? ['s1','s2'] : type === 'b' ? ['b1','b2','b3'] : ['o1','o2','o3'];
  ids.forEach((id, i) => {
    const dot = document.getElementById(id);
    dot.className = 'count-dot' + (i < count ? ` ${cls}` : '');
  });
}

function showMessage(text, cls) {
  const el = document.getElementById('pitchMessage');
  el.textContent = text;
  el.className = 'pitch-message ' + cls;
  requestAnimationFrame(() => el.classList.add('show'));
}

function hideMessage() {
  const el = document.getElementById('pitchMessage');
  el.classList.remove('show');
}

function enablePitch() {
  canPitch = true;
  document.getElementById('pitchBtn').disabled = false;
  document.getElementById('pitchBtn').textContent = '⚾ 클릭해서 투구!';
  document.getElementById('gameInstructions').textContent =
    '스트라이크 존(점선)을 클릭하면 스트라이크! 밖이면 볼!';
}

// ── GAME FLOW ─────────────────────────────────────────────
window.startGame = function() {
  const input = document.getElementById('usernameInput');
  playerName = input.value.trim();
  if (!playerName) {
    input.style.borderColor = 'var(--strike-red)';
    input.placeholder = '닉네임을 입력해주세요!';
    setTimeout(() => { input.style.borderColor = ''; }, 1500);
    return;
  }

  strikes = 0; balls = 0; outs = 0;
  strikeouts = 0; walks = 0; pitchCount = 0;
  gameOver = false;
  ball = null;

  showScreen('gameScreen');
  document.getElementById('headerPlayerName').textContent = playerName;
  gameStarted = true;

  setTimeout(() => {
    resizeCanvas();
    listenLeaderboard();
    setTimeout(() => {
      canPitch = true;
      document.getElementById('pitchBtn').textContent = '⚾ 클릭해서 투구!';
    }, 300);
  }, 100);
};

window.readyNextPitch = function() {
  if (!canPitch) return;
};

function endInning() {
  gameOver = true;
  const score = calculateScore();

  document.getElementById('resultEmoji').textContent = strikeouts === 3 ? '🔥' : strikeouts >= 2 ? '⚾' : '😤';
  document.getElementById('resultTitle').textContent =
    strikeouts === 3 ? '퍼펙트 이닝!' : strikeouts >= 2 ? '훌륭한 투구!' : '1이닝 완투!';
  document.getElementById('resultPlayerName').textContent = `${playerName} 투수`;
  document.getElementById('resultK').textContent = strikeouts;
  document.getElementById('resultBB').textContent = walks;
  document.getElementById('resultScore').textContent = score;

  saveScore(playerName, score, strikeouts, walks, pitchCount);
  showScreen('resultScreen');
  if (strikeouts >= 2) spawnConfetti();
}

function calculateScore() {
  return strikeouts * 300 - walks * 100 + Math.max(0, 500 - pitchCount * 10);
}

// ── FIREBASE ──────────────────────────────────────────────
async function saveScore(name, score, k, bb, pitches) {
  const entry = {
    name, score, k, bb, pitches,
    date: new Date().toLocaleDateString('ko-KR'),
    timestamp: Date.now()
  };

  // Local fallback
  localScores.push(entry);
  localScores.sort((a,b) => b.score - a.score);

  if (db) {
    try {
      await push(ref(db, 'scores'), entry);
    } catch(e) {
      console.warn('Firebase 저장 실패:', e);
    }
  }

  // Show rank
  const rank = localScores.findIndex(s => s.name === name && s.score === score) + 1;
  const rankText = rank === 1 ? '🥇 1위!' : rank === 2 ? '🥈 2위!' : rank === 3 ? '🥉 3위!' : `${rank}위`;
  document.getElementById('resultRankInfo').textContent = `${rankText} 점수: ${score}점`;

  renderLeaderboard(localScores.slice(0, 20), name);
}

function listenLeaderboard() {
  if (db) {
    const q = query(ref(db, 'scores'), orderByChild('score'), limitToLast(20));
    onValue(q, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const scores = Object.values(data).sort((a,b) => b.score - a.score);
        localScores = scores;
        renderLeaderboard(scores, playerName);
      }
    });
  } else {
    renderLeaderboard(localScores, playerName);
  }
}

function renderLeaderboard(scores, myName) {
  const el = document.getElementById('leaderboard');
  if (!scores || scores.length === 0) {
    el.innerHTML = '<div class="no-scores">아직 기록이 없습니다.<br>첫 번째 투수가 되어보세요!</div>';
    return;
  }

  const medals = ['gold','silver','bronze'];
  el.innerHTML = scores.slice(0, 20).map((s, i) => `
    <div class="rank-item${s.name === myName ? ' me' : ''}">
      <div class="rank-num ${medals[i] || 'other'}">${i + 1}</div>
      <div class="rank-info">
        <div class="rank-name">${s.name}</div>
        <div class="rank-detail">⚡${s.k}K · 😅${s.bb}BB · ${s.date || ''}</div>
      </div>
      <div class="rank-score">${s.score}</div>
    </div>
  `).join('');
}

window.showLeaderboard = function() {
  renderLeaderboard(localScores, playerName);
};

// ── RESULT ACTIONS ────────────────────────────────────────
window.playAgain = function() {
  strikes = 0; balls = 0; outs = 0;
  strikeouts = 0; walks = 0; pitchCount = 0;
  gameOver = false;
  ball = null;
  canPitch = false;

  updateDots('s', 0, 'strike');
  updateDots('b', 0, 'ball');
  updateDots('o', 0, 'out');

  showScreen('gameScreen');
  drawField();
  setTimeout(() => enablePitch(), 200);
};

window.goToLogin = function() {
  showScreen('loginScreen');
  gameStarted = false;
};

// ── UTILS ─────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function spawnConfetti() {
  const colors = ['#E8521A','#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96E6A1'];
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: -20px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        transform: rotate(${Math.random() * 360}deg);
        animation-duration: ${1.5 + Math.random() * 2}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 30);
  }
}

// Login enter key
document.getElementById('usernameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame();
});

// Resize handler
window.addEventListener('resize', () => {
  if (gameStarted) resizeCanvas();
});

// CanvasRenderingContext2D.roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r);
    this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h);
    this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r);
    this.arcTo(x, y, x + r, y, r);
    this.closePath();
  };
}
